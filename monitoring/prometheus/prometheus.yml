global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:3000
          - product-service:3000
          - order-service:3000
          - payment-service:3000
          - notification-service:3000
          - profile-service:3000

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: nginx-gateway
    static_configs:
      - targets:
          - nginx-exporter:9113

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: uptime
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://frontend/health
          - http://api-gateway/health
          - http://auth-service:3000/health
          - http://product-service:3000/health
          - http://order-service:3000/health
          - http://payment-service:3000/health
          - http://notification-service:3000/health
          - http://profile-service:3000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115


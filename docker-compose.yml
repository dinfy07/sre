services:
  frontend:
    build:
      context: ./frontend
    image: endterm/frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - public
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  api-gateway:
    build:
      context: ./gateway
    image: endterm/api-gateway:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth-service
      - product-service
      - order-service
      - payment-service
      - notification-service
      - profile-service
    networks:
      - public
      - backend
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  auth-service:
    build:
      context: ./services/auth-service
    image: endterm/auth-service:latest
    environment: &service-env
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres-primary
      POSTGRES_PORT: 5432
      POSTGRES_DB: endterm
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      JWT_SECRET: change-me-in-production
    depends_on:
      - postgres-primary
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  product-service:
    build:
      context: ./services/product-service
    image: endterm/product-service:latest
    environment: *service-env
    depends_on:
      - postgres-primary
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  order-service:
    build:
      context: ./services/order-service
    image: endterm/order-service:latest
    environment: *service-env
    depends_on:
      - postgres-primary
    networks:
      - backend
    restart: unless-stopped
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  payment-service:
    build:
      context: ./services/payment-service
    image: endterm/payment-service:latest
    environment: *service-env
    depends_on:
      - postgres-primary
    networks:
      - backend
    restart: unless-stopped
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  notification-service:
    build:
      context: ./services/notification-service
    image: endterm/notification-service:latest
    environment: *service-env
    depends_on:
      - postgres-primary
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  profile-service:
    build:
      context: ./services/profile-service
    image: endterm/profile-service:latest
    environment: *service-env
    depends_on:
      - postgres-primary
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres-primary:
    image: postgres:15
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: endterm
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d endterm"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-replica-1:
    image: postgres:15
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: endterm
    volumes:
      - postgres_replica_1_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d endterm"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-replica-2:
    image: postgres:15
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: endterm
    volumes:
      - postgres_replica_2_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d endterm"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://app_user:app_password@postgres-primary:5432/endterm?sslmode=disable
    depends_on:
      - postgres-primary
    networks:
      - backend
      - monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./monitoring/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - backend
      - monitoring
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - "-nginx.scrape-uri=http://api-gateway/nginx_status"
    depends_on:
      - api-gateway
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped

networks:
  public:
  backend:
    internal: true
  monitoring:

volumes:
  postgres_primary_data:
  postgres_replica_1_data:
  postgres_replica_2_data:
  prometheus_data:
  grafana_data:
---
- name: Deploy Endterm platform
  hosts: sre_nodes
  become: true
  vars:
    project_root: "{{ lookup('env', 'PWD') | default('/opt/endterm', true) }}"
  tasks:
    - name: Build Docker images
      ansible.builtin.command: docker compose build
      args:
        chdir: "{{ project_root }}"
      changed_when: true

    - name: Start Docker Compose platform
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ project_root }}"
      changed_when: true

    - name: Show running services
      ansible.builtin.command: docker compose ps
      args:
        chdir: "{{ project_root }}"
      changed_when: false


apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: endterm
data:
  default.conf: |
    upstream auth_service {
        server auth-service:3000;
    }

    upstream product_service {
        server product-service:3000;
    }

    upstream order_service {
        server order-service:3000;
    }

    upstream payment_service {
        server payment-service:3000;
    }

    upstream notification_service {
        server notification-service:3000;
    }

    upstream profile_service {
        server profile-service:3000;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"service":"api-gateway","status":"ok"}';
        }

        location = /nginx_status {
            access_log off;
            stub_status;
        }

        location /api/auth/ {
            proxy_pass http://auth_service/;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }

        location = /api/products {
            proxy_pass http://product_service/;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }

        location /api/products/ {
            proxy_pass http://product_service/;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }

        location = /api/orders {
            proxy_pass http://order_service/;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }

        location /api/orders/ {
            proxy_pass http://order_service/;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }

        location = /api/payments {
            proxy_pass http://payment_service/;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }

        location /api/payments/ {
            proxy_pass http://payment_service/;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }

        location = /api/notifications {
            proxy_pass http://notification_service/;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }

        location /api/notifications/ {
            proxy_pass http://notification_service/;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }

        location = /api/profile {
            proxy_pass http://profile_service/;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }

        location /api/profile/ {
            proxy_pass http://profile_service/;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }
    }
  proxy-headers.conf: |
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
